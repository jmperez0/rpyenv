[package]
name = "pyenv"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true
build = "build.rs"

[[bin]]
name = "pyenv"
path = "src/main.rs"

[dependencies]
rpyenv-core.workspace = true
# Installer (spec §3: the CLI may link HTTP/TLS and archive code; the shims may not).
ureq = { version = "3.4.2", default-features = false, features = ["rustls", "platform-verifier"] }
sha2 = "0.11.0"
ctrlc = "3.5.2"
flate2 = "1.1.10"
bzip2 = "0.6.1"
lzma-rust2 = "0.21.0"
tar = "0.4.46"
# Windows installer (M2b): OpenPGP signatures on python.org MSIs (spec §9.1). Pure Rust;
# default features off (measured: 143 crates, no C). Exact: the policy wrapper in
# `install::openpgp` was read and measured against 0.21.0.
pgp = { version = "=0.21.0", default-features = false }
# MSI tables and cabinets, read in-process: no msiexec, no registry (spec §9.1, plan Decision 4).
msi = "0.10.0"
# Exact: `msi::cab_for_each_sequential` relies on how 0.6.0 parses a patched CFFILE record.
cab = "=0.6.0"
md-5 = "0.11.0"
# python.org's Install Manager zips (deflate only; flate2 is already linked).
zip = { version = "8.6.0", default-features = false, features = ["deflate-flate2"] }
# python.org's Install Manager index (JSON).
serde_json = "1"

[build-dependencies]
flate2 = "1.1.10"
tar = "0.4.46"

[dev-dependencies]
tempfile.workspace = true
flate2 = "1.1.10"
tar = "0.4.46"

[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"

[target.'cfg(windows)'.dev-dependencies]
# Tests read the fixture's registry values as stored (`reg query` prints in the OEM code page).
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Registry"] }

# Test-only multi-call fake of a conda NSIS installer (M7c plan Task 8); never packaged:
# the MSI and tarball name their files.
[[bin]]
name = "fake-conda-installer"
path = "tests/fake/fake_conda_installer.rs"
test = false
doc = false

[target.'cfg(windows)'.dependencies]
# The fake installer reads its raw command line as NSIS does (GetCommandLineW); winconda expands
# 8.3 short names (GetLongPathNameW). rpyenv-core already builds this crate.
windows-sys = { version = "0.61", features = ["Win32_System_Environment", "Win32_Storage_FileSystem"] }
