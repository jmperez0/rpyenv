[package]
name = "pyenv"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true
build = "build.rs"

[[bin]]
name = "pyenv"
path = "src/main.rs"

[dependencies]
rpyenv-core.workspace = true
# Installer (spec §3: the CLI may link HTTP/TLS and archive code; the shims may not).
ureq = { version = "3.4.2", default-features = false, features = ["rustls", "platform-verifier"] }
sha2 = "0.11.0"
ctrlc = "3.5.2"
flate2 = "1.1.10"
bzip2 = "0.6.1"
lzma-rust2 = "0.21.0"
tar = "0.4.46"
# Windows installer (M2b): OpenPGP signatures on python.org MSIs (spec §9.1). Pure Rust;
# default features off (measured: 143 crates, no C).
pgp = { version = "0.21.0", default-features = false }
# MSI tables and cabinets, read in-process: no msiexec, no registry (spec §9.1, plan Decision 4).
msi = "0.10.0"
# Exact: `msi::cab_for_each_sequential` relies on how 0.6.0 parses a patched CFFILE record.
cab = "=0.6.0"
md-5 = "0.11.0"
# python.org's Install Manager zips (deflate only; flate2 is already linked).
zip = { version = "8.6.0", default-features = false, features = ["deflate-flate2"] }
# python.org's Install Manager index (JSON).
serde_json = "1"

[build-dependencies]
flate2 = "1.1.10"
tar = "0.4.46"

[dev-dependencies]
tempfile.workspace = true
flate2 = "1.1.10"
tar = "0.4.46"

[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"
