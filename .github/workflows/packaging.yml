name: Packaging
# Builds and verifies the release assets on pull requests that touch packaging (M6b
# design §7.3), so a break shows before a tag.
on:
  pull_request:
    paths:
      - "installer/**"
      - "install.sh"
      - "ci/package_linux.sh"
      - "ci/check_real_install.sh"
      - "ci/test_install_sh.py"
      - "ci/pe_imports.py"
      - "ci/signing.py"
      - "ci/check_signed.py"
      - "ci/requirements-signing.txt"
      - "ci/signing_selftest.ps1"
      # What the MSI's custom actions run (M6b final review M9).
      - "crates/pyenv/src/commands/setup_win.rs"
      - "crates/pyenv/src/commands/migrate_win.rs"
      - "crates/pyenv/src/commands/pwsh_profile.rs"
      - "crates/pyenv/src/lib.rs"
      - "crates/rpyenv-core/src/winenv.rs"
      - "crates/rpyenv-core/src/pathlist.rs"
      - ".cargo/**"
      - ".config/dotnet-tools.json"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/build.yml"
      - ".github/workflows/packaging.yml"
      - ".github/workflows/release.yml"
      - ".github/workflows/msi.yml"
      - ".github/workflows/release-msi.yml"
      - ".github/workflows/release-finish.yml"

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/build.yml
