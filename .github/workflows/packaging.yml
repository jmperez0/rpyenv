name: Packaging
# Builds and verifies the release assets on pull requests that touch packaging (M6b
# design §7.3), so a break shows before a tag.
on:
  pull_request:
    paths:
      - "installer/**"
      - "install.sh"
      - "ci/package_linux.sh"
      - "ci/check_real_install.sh"
      - "ci/test_install_sh.py"
      - "ci/pe_imports.py"
      - "ci/signing.py"
      - "ci/check_signed.py"
      - "ci/requirements-signing.txt"
      - "ci/signing_selftest.ps1"
      # What the MSI's custom actions run (M6b final review M9).
      - "crates/pyenv/src/commands/setup_win.rs"
      - "crates/pyenv/src/commands/migrate_win.rs"
      - "crates/pyenv/src/commands/pwsh_profile.rs"
      - "crates/pyenv/src/lib.rs"
      - "crates/rpyenv-core/src/winenv.rs"
      - "crates/rpyenv-core/src/pathlist.rs"
      - ".cargo/**"
      - ".config/dotnet-tools.json"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/build.yml"
      - ".github/workflows/packaging.yml"
      - ".github/workflows/release.yml"
      - ".github/workflows/msi.yml"
      - ".github/workflows/release-msi.yml"
      - ".github/workflows/release-finish.yml"

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/build.yml

  signing-selftest:
    name: signing check self-test
    needs: build
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install --require-hashes --only-binary ":all:" -r ci/requirements-signing.txt
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: exes-x64
          path: art/exes
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: msi-x64
          path: art/msi
      - name: Sign with a throwaway certificate; check what must pass and what must fail
        shell: pwsh
        run: ./ci/signing_selftest.ps1 -Exes art/exes -Msi art/msi
