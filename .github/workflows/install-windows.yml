name: install (Windows, tier 2)

# Real installs of python.org packages (spec §12.5 tier 2; plan M2b Task 11). Every PR: one
# component-MSI version and one index-zip version. Nightly and on demand: every package kind.
on:
  pull_request:
  schedule:
    - cron: "41 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.m.outputs.versions }}
    steps:
      - id: m
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            echo 'versions=["3.10.11","3.12.10","pypy"]' >> "$GITHUB_OUTPUT"
          else
            echo 'versions=["2.7.18","3.4.4","3.5.2","3.10.11","3.12.5","3.12.10","3.13.0t","3.14.0","pypy"]' >> "$GITHUB_OUTPUT"
          fi

  install:
    needs: matrix
    runs-on: windows-2025
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.matrix.outputs.versions) }}
    env:
      VERSION: ${{ matrix.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master, 2026-10-02
        with:
          toolchain: "1.96"
      - run: cargo build --release --workspace
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}\root\install_cache
          key: install-cache-windows-${{ matrix.version }}
      # Pythons below 3.5 link the Visual C++ 2008 (2.6-3.2) or 2010 (3.3-3.4) runtime, which a
      # clean runner may lack; ensurepip then can't start (final review M5).
      - name: Visual C++ runtimes for old Pythons
        if: startsWith(env.VERSION, '2.') || startsWith(env.VERSION, '3.4')
        run: choco install vcredist2008 vcredist2010 -y --no-progress
      - name: Install and check
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'root'
          $env:PYENV_ROOT = $root; $env:PYENV = $root; $env:PYENV_HOME = $root
          $pyenv = 'target\release\pyenv.exe'
          & $pyenv update
          if ($LASTEXITCODE) { exit 1 }
          if ($env:VERSION -eq 'pypy') {
            # M7a design §8: the newest pypy3.11 code pyenv update listed.
            $env:VERSION = (& $pyenv install --list | Select-String '^pypy3\.11-v' | Select-Object -Last 1).Line.Trim()
            if (-not $env:VERSION) { Write-Error 'no pypy3.11 code listed'; exit 1 }
          }
          $start = Get-Date
          & $pyenv install $env:VERSION
          $code = $LASTEXITCODE
          $secs = [int]((Get-Date) - $start).TotalSeconds
          "| version | seconds | exit |`n|---|---|---|`n| $env:VERSION | $secs | $code |" >> $env:GITHUB_STEP_SUMMARY
          if ($code) { exit $code }
          python ci/check_install_win.py $root $env:VERSION
          if ($LASTEXITCODE) { exit 1 }

  # Real installs of the three conda kinds (M7c design §4; plan M7c Task 10). Each name is checked on its own
  # runner by ci/check_conda_win.py. Runs wherever this file does: every PR (no path filter, so edits to
  # winconda.rs, conda.rs, condacatalog.rs, windows.tsv and the script all trigger it), nightly and on demand.
  conda:
    runs-on: windows-2025
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        kind: [miniforge3, miniconda3, miniforge3-latest]
    # Miniforge 26.9.4-0 is broken on Windows upstream: conda 26.9.4 looks for its launcher stub only in the
    # conda-launchers record's paths_data, which that installer leaves empty, so creating any env with entry
    # points fails (reproduced 2026-10-24 with the stock installer and no rpyenv; conda-forge/miniforge#913 is
    # another symptom). While MINIFORGE_BROKEN names the newest release: the miniforge3 row checks
    # MINIFORGE_HOLD instead, and the miniforge3-latest row (always /releases/latest/) still runs but can't fail
    # the job. Empty both once a fixed release is out.
    env:
      MINIFORGE_BROKEN: miniforge3-26.9.4-0
      MINIFORGE_HOLD: miniforge3-26.7.2-1
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master, 2026-10-02
        with:
          toolchain: "1.96"
      - run: cargo build --release -p pyenv -p pyenv-shim -p pyenv-shimw
      - name: Install and check
        shell: pwsh
        env:
          KIND: ${{ matrix.kind }}
        run: |
          # The release binary reads <exe dir>\..\share\conda\windows.tsv = target\share\conda\windows.tsv.
          New-Item -ItemType Directory -Force target\share\conda | Out-Null
          Copy-Item crates\pyenv\conda\windows.tsv target\share\conda\windows.tsv
          $root = Join-Path $env:RUNNER_TEMP 'root'
          New-Item -ItemType Directory -Force $root | Out-Null
          $env:PYENV_ROOT = $root; $env:PYENV = $root; $env:PYENV_HOME = $root
          $env:HOME = Join-Path $env:RUNNER_TEMP 'home'
          New-Item -ItemType Directory -Force $env:HOME | Out-Null
          $pyenv = (Resolve-Path 'target\release\pyenv.exe').Path
          # --ignore: an update failure (e.g. GitHub's shared API limit) must not fail the check; the shipped
          # table is there anyway (M7c rulings R3, D9).
          & $pyenv update --ignore
          "update exit $LASTEXITCODE; .conda_versions.tsv written: $(Test-Path (Join-Path $root '.conda_versions.tsv'))"
          if ($env:KIND -eq 'miniforge3-latest') {
            $name = $env:KIND
          } else {
            $name = (& $pyenv latest -k $env:KIND | Select-Object -Last 1)
            if ($LASTEXITCODE -or -not $name) { Write-Error "no installable $env:KIND name"; exit 1 }
            $name = $name.Trim()
            if ($env:MINIFORGE_BROKEN -and $name -eq $env:MINIFORGE_BROKEN) {
              "$name is known broken upstream; checking $env:MINIFORGE_HOLD instead"
              $name = $env:MINIFORGE_HOLD
            }
          }
          $start = Get-Date
          python ci/check_conda_win.py $name
          $code = $LASTEXITCODE
          $secs = [int]((Get-Date) - $start).TotalSeconds
          "| name | seconds | exit |`n|---|---|---|`n| $name | $secs | $code |" >> $env:GITHUB_STEP_SUMMARY
          if ($code -and $env:KIND -eq 'miniforge3-latest' -and $env:MINIFORGE_BROKEN) {
            "::warning::miniforge3-latest failed (exit $code) while $env:MINIFORGE_BROKEN is held as broken; not failing the job"
            exit 0
          }
          if ($code) { exit 1 }
