name: Build packages
# Builds and verifies the release files (M6b design §7, Phase 3 spec §5). Called by
# packaging.yml (pull requests: everything, unsigned) and release.yml (msi: false; the
# MSIs are built by release-msi.yml from the signed executables).
on:
  workflow_call:
    inputs:
      msi:
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  exes:
    name: exes (${{ matrix.arch }})
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-2025
          - arch: arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master, 2026-10-02
        with:
          toolchain: "1.96"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: cargo build --release --locked -p pyenv -p pyenv-shim -p pyenv-shimw
      - name: Static C runtime
        run: python ci/pe_imports.py --check target/release/pyenv.exe target/release/pyenv-shim.exe target/release/pyenv-shimw.exe
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: exes-${{ matrix.arch }}
          path: |
            target/release/pyenv.exe
            target/release/pyenv-shim.exe
            target/release/pyenv-shimw.exe
          if-no-files-found: error

  msi:
    needs: exes
    if: inputs.msi
    uses: ./.github/workflows/msi.yml

  linux:
    name: tarball (${{ matrix.arch }})
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master, 2026-10-02
        with:
          toolchain: "1.96"
          targets: x86_64-unknown-linux-musl, aarch64-unknown-linux-musl
      - run: sudo apt-get update && sudo apt-get install -y musl-tools shellcheck
      - run: sh ci/package_linux.sh dist
      - name: install.sh tests
        run: python3 -m unittest ci/test_install_sh.py -v
      - run: shellcheck -s sh install.sh
      - name: install.sh with the real tarball, no terminal
        run: sh ci/check_real_install.sh dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tar-${{ matrix.arch }}
          path: dist/*.tar.gz
          if-no-files-found: error
