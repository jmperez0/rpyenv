name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, windows-2022, ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master, 2026-10-02
        with:
          toolchain: "1.96"
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo build --workspace
      - name: Static C runtime (M6b design §7.1)
        if: startsWith(matrix.os, 'windows')
        run: python ci/pe_imports.py --check target/debug/pyenv.exe target/debug/pyenv-shim.exe target/debug/pyenv-shimw.exe
      - name: Shim dependency guard (spec §3)
        if: matrix.os == 'ubuntu-latest'
        run: |
          python3 ci/pe_imports.py --self-test
          python3 ci/shim_deps.py --self-test
          python3 ci/shim_deps.py
      # The window-close tests in Windows Terminal, windows-2025's default terminal, before the step
      # below switches to conhost: on CI the helper closes the Terminal window hosting the console
      # (ARGV_ECHO_CLOSE_TERMINAL). The count makes sure both closes went to Terminal, so a run
      # that fell back to conhost or skipped fails.
      - name: Window-close tests in Windows Terminal
        if: matrix.os == 'windows-2025'
        shell: bash
        run: |
          cargo test -p rpyenv-e2e --test windows closing_the_window -- --nocapture --test-threads=1 2>&1 | tee wt-close.log
          test "${PIPESTATUS[0]}" -eq 0
          n=$(grep -c 'closing "CASCADIA_HOSTING_WINDOW_CLASS"' wt-close.log || true)
          echo "closes that went to Windows Terminal: $n"
          test "$n" -eq 2
      # windows-2025's default terminal is Windows Terminal, and the e2e window-close tests can only
      # close conhost's windows: they printed E2E-SKIP there and checked nothing. This sets what
      # Settings > System > For developers > Terminal = "Windows Console Host" sets, for the
      # runner's user.
      - name: Classic console as the default terminal
        if: startsWith(matrix.os, 'windows')
        shell: pwsh
        run: |
          $k = 'HKCU:\Console\%%Startup'
          if (-not (Test-Path $k)) { New-Item -Path $k | Out-Null }
          $conhost = '{B23D10C0-E52E-411E-9D5B-C09FDF709C7D}'
          Set-ItemProperty -Path $k -Name DelegationConsole -Value $conhost
          Set-ItemProperty -Path $k -Name DelegationTerminal -Value $conhost
          Get-ItemProperty -Path $k | Format-List DelegationConsole, DelegationTerminal
      - run: cargo test --workspace
