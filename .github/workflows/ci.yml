name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, windows-2022, ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master, 2026-10-02
        with:
          toolchain: "1.96"
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo build --workspace
      - name: Static C runtime (M6b design §7.1)
        if: startsWith(matrix.os, 'windows')
        run: python ci/pe_imports.py --check target/debug/pyenv.exe target/debug/pyenv-shim.exe target/debug/pyenv-shimw.exe
      - name: Shim dependency guard (spec §3)
        if: matrix.os == 'ubuntu-latest'
        run: |
          python3 ci/pe_imports.py --self-test
          python3 ci/shim_deps.py --self-test
          python3 ci/shim_deps.py
      - run: cargo test --workspace
