name: sync-python-build
# Brings crates/pyenv/python-build in step with pyenv's latest release (plan M2a, Decision 1),
# weekly and on demand. When the vendored copy differs, it does the mechanical part of the sync
# and opens (or updates) a pull request that reports what it found:
#   - updates the vendored copy (ci/sync_python_build.py), including python-build/UPSTREAM,
#     which pins the pyenv commit parity.yml compares against. The pin is not in a workflow
#     file because GITHUB_TOKEN may not push workflow changes (the 2026-10-12 run failed so);
#   - rebuilds the PyPy tables (ci/pypy_tables.py) from the vendored definitions and pypy.org,
#     and the conda table (ci/conda_tables.py) from the vendored conda definitions
#     (a failure in either is reported in the pull request and fails the run, but doesn't stop
#     the CPython sync);
#   - regenerates the Linux parity goldens against the new pyenv;
#   - runs cargo test, the differential cases and the upstream bats suite, and puts each
#     result, pass or fail, in the pull request;
#   - lists pyenv's changes outside the definitions (libexec, bin/python-build, tests), which
#     may need porting, as 2.8.8's `exec -N` did.
# Failures are left for a person: a test that names a vendored version, a bats row to add or
# drop in parity/expected/bats.txt, a behavior to port. `pyenv --version` follows
# python-build/UPSTREAM, so the version needs no edit.
# A pull request created with GITHUB_TOKEN triggers no CI run: push a commit to its branch, or
# close and reopen it, to start one.
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

env:
  BATS_VERSION: "1.11.1"

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Fetch pyenv's latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh api repos/pyenv/pyenv/releases/latest --jq .tag_name)
          sha=$(gh api "repos/pyenv/pyenv/commits/$tag" --jq .sha)
          curl -fsSL "https://github.com/pyenv/pyenv/archive/$sha.tar.gz" | tar -xz -C "$RUNNER_TEMP"
          old=$(cut -d ' ' -f 2 crates/pyenv/python-build/UPSTREAM)
          echo "TAG=$tag" >> "$GITHUB_ENV"
          echo "SHA=$sha" >> "$GITHUB_ENV"
          echo "OLD_SHA=$old" >> "$GITHUB_ENV"
      - name: Update the vendored copy and the parity pin
        run: python3 ci/sync_python_build.py --upstream "$RUNNER_TEMP/pyenv-$SHA" --commit "$SHA" --write
      # M7a design §4.1, §5.1 and M7b design §4.1: the PyPy and conda tables, rebuilt every week even when pyenv hasn't
      # changed (a new PyPy release reaches the Windows table this way). The definitions run
      # in a container with no network. Each table has its own step: a failure in one (pypy.org
      # down or reshaped, or a conda definition the evaluator can't read) holds back neither the
      # other table nor the CPython sync. That table stays as it was, the pull request reports the
      # failure, and the last step fails the job. A vendored PyPy or conda name with no table row
      # is refused as "not available", never downloaded, until a later run succeeds.
      - name: Rebuild the PyPy tables
        id: pypy
        continue-on-error: true
        run: |
          set -o pipefail
          log="$RUNNER_TEMP/pypy.log"
          if ! {
            mkdir -p "$RUNNER_TEMP/pypy-pages" &&
            curl -fsSL -o "$RUNNER_TEMP/pypy-pages/versions.json" https://downloads.python.org/pypy/versions.json &&
            curl -fsSL -o "$RUNNER_TEMP/pypy-pages/checksums.html" https://www.pypy.org/checksums.html &&
            python3 ci/pypy_tables.py --share crates/pyenv/python-build/share --pages "$RUNNER_TEMP/pypy-pages" --engine docker --write
          } 2>&1 | tee "$log"; then
            git checkout -- crates/pyenv/pypy
            git clean -fdq -- crates/pyenv/pypy
            exit 1
          fi
      # Before the conda step: it runs the Windows table example (M7c design §4.2). Unconditional,
      # since whether anything changed isn't known until after the tables are rebuilt.
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master, 2026-10-02
        with:
          toolchain: "1.96"
      - name: Rebuild the conda table
        id: conda
        continue-on-error: true
        run: |
          set -o pipefail
          log="$RUNNER_TEMP/conda.log"
          if ! python3 ci/conda_tables.py --share crates/pyenv/python-build/share --engine docker --write 2>&1 | tee "$log"; then
            git checkout -- crates/pyenv/conda
            git clean -fdq -- crates/pyenv/conda
            exit 1
          fi
          # M7c design §4.2: the Windows table, from the publishers' pages. The step's `set -o
          # pipefail` makes `$?` below cargo's status, not tee's.
          set +e
          cargo run -q -p pyenv --example conda_windows_table -- crates/pyenv/conda/linux.tsv crates/pyenv/conda/windows.tsv 2> "$RUNNER_TEMP/conda-win.err" | tee -a "$log"
          win=$?
          set -e
          cat "$RUNNER_TEMP/conda-win.err" | tee -a "$log"
          if [ "$win" = 2 ]; then
            git checkout -- crates/pyenv/conda/windows.tsv
            exit 1
          fi
          # 1: the table is written (new releases arrive) but a hash changed or a row stopped
          # installing; the PR names them and the last step fails (M7c design §4.2 steps 5-6).
          echo "conda_win_attention=$win" >> "$GITHUB_OUTPUT"
      - name: Anything to propose?
        id: update
        run: |
          if [ -z "$(git status --porcelain crates/pyenv/python-build crates/pyenv/pypy crates/pyenv/conda)" ]; then
            echo "up to date with $TAG, pypy.org and the conda definitions"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
          # Only the PyPy or conda tables changed (crates/pyenv/python-build is untouched): the pull
          # request must not claim a pyenv sync or a parity-pin bump.
          if [ -z "$(git status --porcelain crates/pyenv/python-build)" ]; then
            echo "python_build=false" >> "$GITHUB_OUTPUT"
          else
            echo "python_build=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Build, regenerate the goldens, and run the checks
        if: steps.update.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PYPY: ${{ steps.pypy.outcome }}
          CONDA: ${{ steps.conda.outcome }}
          CONDA_WIN: ${{ steps.conda.outputs.conda_win_attention }}
        run: |
          r="$RUNNER_TEMP/results.md"
          up="$RUNNER_TEMP/pyenv-$SHA"
          cargo build --workspace
          python3 parity/diff.py --rpyenv target/debug --upstream "$up" --update-golden > "$RUNNER_TEMP/golden.log" 2>&1 || true
          check() { # <title> <command…>: runs it, records pass or fail and the output's tail
            local title=$1; shift
            if "$@" > "$RUNNER_TEMP/out.log" 2>&1; then echo "- **$title**: pass" >> "$r"
            else
              { echo "- **$title**: FAIL"; echo '  ```'; tail -n 30 "$RUNNER_TEMP/out.log" | sed 's/^/  /'; echo '  ```'; } >> "$r"
            fi
          }
          table() { # <title> <outcome> <folder> <log>: the table step's result and, on failure, its log's tail
            if [ "$2" = "success" ]; then echo "- **$1**: pass" >> "$r"
            else
              { echo "- **$1**: FAIL; \`$3\` was left as it was"
                echo '  ```'; { tail -n 30 "$4" 2>/dev/null || true; } | sed 's/^/  /'; echo '  ```'; } >> "$r"
            fi
          }
          : > "$r"
          table "PyPy tables (ci/pypy_tables.py)" "$PYPY" crates/pyenv/pypy/ "$RUNNER_TEMP/pypy.log"
          table "conda table (ci/conda_tables.py)" "$CONDA" crates/pyenv/conda/ "$RUNNER_TEMP/conda.log"
          if [ "$CONDA_WIN" = "1" ]; then
            { echo "- **Windows conda table (crates/pyenv/conda/windows.tsv)**: needs attention"
              echo '  ```'; sed 's/^/  /' "$RUNNER_TEMP/conda-win.err"; echo '  ```'; } >> "$r"
          elif [ "$CONDA_WIN" = "0" ]; then echo "- **Windows conda table (crates/pyenv/conda/windows.tsv)**: pass" >> "$r"
          fi
          check "cargo test --workspace" cargo test --workspace
          check "differential cases (parity/diff.py)" python3 parity/diff.py --rpyenv target/debug --upstream "$up"
          curl -fsSL "https://github.com/bats-core/bats-core/archive/refs/tags/v${BATS_VERSION}.tar.gz" | tar -xz -C "$RUNNER_TEMP"
          run_bats() { # as parity.yml's bats step, against the new pyenv
            docker run --rm -v "$PWD:/w" -v "$RUNNER_TEMP:/t" -w /w debian:trixie-slim bash -c \
              'apt-get update -qq && apt-get install -y -qq --no-install-recommends gawk git locales >/dev/null && sed -i "/en_US.UTF-8/s/^# //" /etc/locale.gen && locale-gen >/dev/null && bash parity/bats_run.sh /w/target/debug /t/pyenv-'"$SHA"' /t/bats-core-'"$BATS_VERSION"' /w/bats-tap.txt' \
              && python3 parity/bats_check.py bats-tap.txt
          }
          check "upstream bats suite (parity/bats_check.py)" run_bats
          rm -f bats-tap.txt
          {
            echo
            echo "pyenv changes outside the definitions, $OLD_SHA..$SHA (review each; port what rpyenv implements):"
            echo
            gh api "repos/pyenv/pyenv/compare/$OLD_SHA...$SHA" \
              --jq '.files[] | select(.filename | startswith("plugins/python-build/share/") | not) | "- `\(.filename)` (\(.status), +\(.additions) -\(.deletions))"' \
              || echo "- (the compare API failed; compare $OLD_SHA...$SHA by hand)"
          } >> "$r"
      - name: Open or update the pull request
        if: steps.update.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHON_BUILD: ${{ steps.update.outputs.python_build }}
          PYPY: ${{ steps.pypy.outcome }}
          CONDA: ${{ steps.conda.outcome }}
          CONDA_WIN: ${{ steps.conda.outputs.conda_win_attention }}
        run: |
          branch="sync-python-build-$TAG"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add crates/pyenv/python-build crates/pyenv/pypy crates/pyenv/conda parity/golden
          if [ "$PYTHON_BUILD" = "true" ]; then
            title="Sync python-build definitions with pyenv $TAG"
          else
            title="Update the PyPy and conda tables"
          fi
          git commit -m "$title"
          git push -f origin "$branch"
          body="$RUNNER_TEMP/pr-body.md"
          {
            if [ "$PYTHON_BUILD" = "true" ]; then
              echo "Automated: crates/pyenv/python-build updated from pyenv $TAG ($SHA) by ci/sync_python_build.py,"
              echo "the parity pin in \`UPSTREAM\` bumped with it, and the Linux parity goldens regenerated. Review the golden diff."
              if [ "$PYPY" = "success" ]; then
                echo "The PyPy tables in \`crates/pyenv/pypy/\` were rebuilt by ci/pypy_tables.py from the vendored definitions and pypy.org's pages; review their diff."
              else
                echo "The PyPy tables (\`crates/pyenv/pypy/\`) could NOT be rebuilt (see the checks below) and are unchanged: a PyPy version new in this sync is refused as \"not available\" until a later run rebuilds them."
              fi
              if [ "$CONDA" = "success" ]; then
                echo "The conda table in \`crates/pyenv/conda/\` was rebuilt by ci/conda_tables.py from the vendored definitions; review its diff."
              else
                echo "The conda table (\`crates/pyenv/conda/\`) could NOT be rebuilt (see the checks below) and is unchanged: a conda version new in this sync is refused as \"not available\" until a later run rebuilds it."
              fi
            else
              echo "Automated: only the PyPy or conda tables (\`crates/pyenv/pypy/\`, \`crates/pyenv/conda/\`) changed, rebuilt by ci/pypy_tables.py and ci/conda_tables.py from the vendored definitions and pypy.org's pages; the checks below say which rebuild succeeded. Review their diff."
              echo "crates/pyenv/python-build and the parity pin are unchanged (still pyenv $OLD_SHA)."
            fi
            if [ "$CONDA_WIN" = "1" ]; then
              echo
              echo "**Windows conda table needs attention**"
              echo
              echo '```'
              cat "$RUNNER_TEMP/conda-win.err"
              echo '```'
              echo "The table keeps the pinned hash for a changed row (see the README's \"Accepting a changed conda hash\"); check why before accepting it."
            fi
            echo
            echo "Checks run by the workflow:"
            echo
            cat "$RUNNER_TEMP/results.md"
            echo
            echo "A failing check is left for a person: update a test that names a vendored version, add or"
            echo "drop rows in \`parity/expected/bats.txt\`, or port a behavior listed above."
            echo
            echo "This pull request was created with \`GITHUB_TOKEN\`, which triggers no CI run: push a commit to \`$branch\`, or close and reopen it, to start one."
          } > "$body"
          if [ "$(gh pr list --head "$branch" --state open --json number --jq 'length')" = "0" ]; then
            gh pr create --base main --head "$branch" --title "$title" --body-file "$body"
          else
            gh pr edit "$branch" --title "$title" --body-file "$body"
          fi
      # A table step's failure, let through above so the CPython sync could still open its
      # pull request, still fails the run (a scheduled run's failure notifies the owner).
      - name: Fail when a table couldn't be rebuilt
        if: steps.pypy.outcome == 'failure' || steps.conda.outcome == 'failure' || steps.conda.outputs.conda_win_attention == '1'
        env:
          PYPY: ${{ steps.pypy.outcome }}
          CONDA: ${{ steps.conda.outcome }}
          CONDA_WIN: ${{ steps.conda.outputs.conda_win_attention }}
        run: |
          [ "$CONDA_WIN" != "1" ] || echo "::error::Windows conda table: a hash changed or a row stopped installing; see the PR body"
          [ "$PYPY" = "success" ] || echo "::error::ci/pypy_tables.py failed; crates/pyenv/pypy was left unchanged. The step 'Rebuild the PyPy tables' has the log."
          [ "$CONDA" = "success" ] || echo "::error::ci/conda_tables.py failed; crates/pyenv/conda was left unchanged. The step 'Rebuild the conda table' has the log."
          exit 1
