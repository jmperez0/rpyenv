name: sync-python-build
# Brings crates/pyenv/python-build in step with pyenv's latest release (plan M2a, Decision 1):
# opens a pull request when the vendored copy differs. Run by hand only; the pull request is
# not finished on its own. Before merging it:
#   - bump PYENV_SHA in .github/workflows/parity.yml to the synced commit;
#   - regenerate the parity goldens (python parity/diff.py ... --update-golden) and review them;
#   - re-run the bats suite (parity/bats_run.sh) and update parity/expected/bats.txt;
#   - run cargo test and update any test that names a vendored version.
# A pull request created with GITHUB_TOKEN triggers no CI run: push a commit to its branch, or
# close and reopen it, to start one.
on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Fetch pyenv's latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh api repos/pyenv/pyenv/releases/latest --jq .tag_name)
          sha=$(gh api "repos/pyenv/pyenv/commits/$tag" --jq .sha)
          curl -fsSL "https://github.com/pyenv/pyenv/archive/$sha.tar.gz" | tar -xz -C "$RUNNER_TEMP"
          echo "TAG=$tag" >> "$GITHUB_ENV"
          echo "SHA=$sha" >> "$GITHUB_ENV"
      - name: Update the vendored copy
        run: python3 ci/sync_python_build.py --upstream "$RUNNER_TEMP/pyenv-$SHA" --commit "$SHA" --write
      - name: Open a pull request when it changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$(git status --porcelain crates/pyenv/python-build)" ]; then echo "up to date with $TAG"; exit 0; fi
          branch="sync-python-build-$TAG"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add crates/pyenv/python-build
          git commit -m "Sync python-build definitions with pyenv $TAG"
          git push -f origin "$branch"
          existing=$(gh pr list --head "$branch" --state open --json number --jq 'length')
          if [ "$existing" = "0" ]; then
            body_file="$RUNNER_TEMP/pr-body.md"
            {
              echo "Automated: crates/pyenv/python-build updated from pyenv $TAG ($SHA) by ci/sync_python_build.py."
              echo
              echo "Before merging:"
              echo
              echo "- [ ] Bump \`PYENV_SHA\` in \`.github/workflows/parity.yml\` to \`$SHA\`."
              echo "- [ ] Regenerate the parity goldens (\`python parity/diff.py ... --update-golden\`) and review them."
              echo "- [ ] Re-run the bats suite (\`parity/bats_run.sh\`) and update \`parity/expected/bats.txt\`."
              echo "- [ ] Run \`cargo test\` and update any test that names a vendored version."
              echo "- [ ] Start CI: this pull request was created with \`GITHUB_TOKEN\`, which triggers no run. Push a commit to \`$branch\`, or close and reopen the pull request."
            } > "$body_file"
            gh pr create --base main --head "$branch" --title "Sync python-build definitions with pyenv $TAG" --body-file "$body_file"
          else
            echo "a pull request for $branch already exists"
          fi
